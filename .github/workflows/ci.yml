# CI for imotaraapp: typecheck + lint + KB version-sync + unit tests on every push/PR.
# Mirrors imotara-mobile's ci.yml. The KB version-sync check exists because the
# ImotaraKnowledgebase/*.md "Current release" headers drifted out of sync with
# package.json twice in the same day (2026-08-08) with nothing catching it.
#
# Deliberately does NOT run `next build` here: it needs real Supabase/Razorpay
# secrets to prerender some routes, and `postbuild` pings an external URL
# (scripts/ping-sitemap.mjs) — neither is safe to depend on in a bare runner
# without provisioning production secrets as GitHub Actions secrets, which
# wasn't done as part of this change. Add a `build` job later once that's
# deliberately set up, rather than risk a red CI badge for infra reasons
# unrelated to code correctness.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 🔴 THE SIBLING REPO, because one assertion here is a CROSS-REPO one.
      # `usageGeoCollectsNoOneInParticular.test.ts` checks that the Play Data
      # Safety doc in imotara-mobile names IMOTARA_USAGE_GEO_MOBILE — a flag
      # flipped by a WEB deploy that changes what a live Play listing declares
      # about location data. Without this checkout the test cannot see the file
      # and FAILED EVERY RUN of 2026-10-19 while passing on every laptop.
      #
      # 🔑 soumenroys/imotara-mobile is PUBLIC ⇒ no token, no secret.
      #
      # 🔴 AND IT IS MOVED OUT OF THE WORKSPACE, which is the whole point of
      # the second step. Checked out to `imotara-mobile/` INSIDE the workspace,
      # `tsc -p tsconfig.json` swept it up as part of THIS project and produced
      # 100+ errors from a React Native app — missing `expo`, `react-native`,
      # `__DEV__`, jest globals. CI went red for a new reason, caused by the fix
      # for the old one.
      #
      # ⚠️ Moving it to a SIBLING makes the runner's layout identical to a
      # laptop's, so the test's default path (`../imotara-mobile`) resolves in
      # both places and there is ONE behaviour to reason about rather than two.
      - name: Check out imotara-mobile (for the cross-repo Play Data Safety check)
        uses: actions/checkout@v4
        with:
          repository: soumenroys/imotara-mobile
          # `path:` may not escape $GITHUB_WORKSPACE, hence the move below.
          path: _imotara-mobile-checkout

      - name: Put it where this repo expects a sibling
        run: mv "$GITHUB_WORKSPACE/_imotara-mobile-checkout" "$GITHUB_WORKSPACE/../imotara-mobile"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        # P2-11 (code_review_audit_2026_08_14): the repo had 102 real lint
        # errors with no CI gate catching them. All 102 are now fixed — this
        # only needs to catch NEW errors from here on. Warnings don't fail
        # the process (ESLint's exit code only reflects errors unless
        # --max-warnings is set), so the existing 619 pre-existing warnings
        # (tracked as a separate type-safety initiative, see eslint.config.mjs)
        # don't block this.
        run: npx eslint .

      - name: KB version sync (ImotaraKnowledgebase/*.md vs package.json)
        run: npm run check:kb-version

      - name: Unit tests
        # ⚠️ No IMOTARA_MOBILE_DIR here on purpose: the move above puts the
        # sibling exactly where the test's default already looks, so CI and a
        # laptop take the SAME path. The env var remains supported for anyone
        # whose checkout is laid out differently.
        run: npx vitest run
